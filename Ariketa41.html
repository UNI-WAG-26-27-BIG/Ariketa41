<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container my-4" style="max-width: 600px; font-family: sans-serif; color: #333;">
  
  <h3 class="mb-3" style="font-weight: normal;">Saskia egiteko aplikazioa. Idatzi zure erosketak:</h3>
  
  <form id="erosketaForm" class="needs-validation" novalidate>
    <div class="mb-3 d-flex align-items-center gap-2">
      <label for="produktuInput" class="form-label mb-0" style="white-space: nowrap;">Saskira gehitzekoa:</label>
      <div class="w-100">
        <input type="text" class="form-control" id="produktuInput" placeholder="esnea..." required>
        <div class="invalid-feedback">
          Mesedez, idatzi zerbait saskira gehitzeko.
        </div>
      </div>
    </div>
    
    <div class="mb-3">
      <button type="button" id="btnGehitu" class="btn btn-light border">Gehitu</button>
      <button type="button" id="btnErosketa" class="btn btn-light border">Erosketa egin</button>
    </div>
  </form>

  <div id="saskiEremua" class="p-2" style="border: 1px solid #ccc; min-height: 100px;">
    <ul id="saskiZerrenda" class="mb-0" style="padding-left: 20px;">
      </ul>
  </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {
  
  // 1. "Gehitu" botoian klik egitean
  $('#btnGehitu').click(function() {
    var formularioa = $('#erosketaForm');
    var inputa = $('#produktuInput');
    var testua = inputa.val().trim();
    
    // Bootstrap balidazioa egiaztatu
    if (formularioa[0].checkValidity() === false || testua === "") {
      formularioa.addClass('was-validated');
    } else {
      // Balidazio klasea kendu hurrengorako
      formularioa.removeClass('was-validated');
      
      // Produktua zerrendara gehitu (append eta val erabiliz)
      $('#saskiZerrenda').append('<li>' + testua + '</li>');
      
      // Input eremua garbitu
      inputa.val('');
    }
  });

  // 2. "Erosketa egin" botoian klik egitean
  $('#btnErosketa').click(function() {
    // Alert mezua erakutsi
    alert("Zure erosketa listo dago");
    
    // Atzeko planoa berdez jarri eta testua zuri (css erabiliz)
    $('#saskiEremua').css({
      'background-color': 'green',
      'color': 'white'
    });
    
    // Letra lodia jarri saskiko elementu bakoitzari (each erabiliz)
    $('#saskiZerrenda li').each(function() {
      $(this).css('font-weight', 'bold');
    });
  });

});
</script>
</body>
</html>
